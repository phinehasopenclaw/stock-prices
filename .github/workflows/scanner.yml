name: Gap scanner

# GitHub's cron runs late (hours late on Nov 11), so the schedule is a keep-alive:
# a gate fires every 20 min across 04:00-16:00 CT on weekdays and only starts the
# scanner when none is already running. A scanner that hits the 6-hour job limit
# before the close dispatches its own successor (relay() in scan.py).
# Both CDT and CST are covered by the UTC hour range 9-22.
on:
  schedule:
    - cron: '*/20 9-22 * * 1-5'
  push:
    branches: [main]
    paths: ['scan.py', '.github/workflows/scanner.yml']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hm=$(TZ=America/Chicago date +%H%M); dow=$(TZ=America/Chicago date +%u)
          if [ "$dow" -gt 5 ] || [ "$hm" -lt 0400 ] || [ "$hm" -ge 1600 ]; then
            echo "outside 04:00-16:00 CT weekday window ($hm)"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          busy=0
          for st in in_progress queued; do
            n=$(gh api "repos/$REPO/actions/workflows/scanner.yml/runs?status=$st&per_page=20" \
                  --jq "[.workflow_runs[] | select(.id != $SELF)] | length")
            busy=$((busy + n))
          done
          if [ "$busy" -gt 0 ]; then run=false; else run=true; fi
          echo "chicago=$hm other_active_runs=$busy -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: gap-scanner
      cancel-in-progress: true
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "yfinance>=0.2.54" requests
      - name: Run scanner loop
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scan.py
