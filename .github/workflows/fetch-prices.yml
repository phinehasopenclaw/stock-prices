name: Fetch Stock Prices

on:
  schedule:
    # Every 5 minutes, 6 AM - 5 PM ET (10:00-21:00 UTC), weekdays only
    - cron: '*/5 10-21 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  fetch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch prices from Finnhub
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          set -o pipefail

          # Guard 1: secret must exist
          if [ -z "${FINNHUB_KEY:-}" ]; then
            echo "::error::FINNHUB_KEY secret is missing or empty"
            exit 1
          fi

          # ---- Market status (Finnhub, with clock fallback) ----
          MS=$(curl -s --max-time 15 "https://finnhub.io/api/v1/stock/market-status?exchange=US&token=${FINNHUB_KEY}" || true)
          if echo "$MS" | jq -e 'type == "object" and has("isOpen")' >/dev/null 2>&1; then
            HOLIDAY=$(echo "$MS" | jq -r '.holiday // empty')
            SESSION=$(echo "$MS" | jq -r '.session // empty')
            IS_OPEN=$(echo "$MS" | jq -r '.isOpen')
            if [ -n "$HOLIDAY" ] && [ "$IS_OPEN" != "true" ]; then
              STATUS="holiday"; NOTE="Market closed ($HOLIDAY) - prices are the last close."
            elif [ "$IS_OPEN" = "true" ] && [ "$SESSION" = "regular" ]; then
              STATUS="open"; NOTE="Market open - live prices."
            elif [ "$SESSION" = "pre-market" ]; then
              STATUS="pre-market"; NOTE="Pre-market - prices are the last regular-session close."
            elif [ "$SESSION" = "post-market" ]; then
              STATUS="after-hours"; NOTE="After hours - prices are today's close."
            else
              STATUS="closed"; NOTE="Market closed - prices are the last close."
            fi
          else
            # Fallback: regular session by the clock (does not know holidays)
            DOW=$(TZ='America/New_York' date +%u)
            HM=$(TZ='America/New_York' date +%H%M)
            if [ "$DOW" -le 5 ] && [ "$HM" -ge 0930 ] && [ "$HM" -lt 1600 ]; then
              STATUS="open"; NOTE="Market open by clock - live prices (holiday calendar unavailable)."
            else
              STATUS="closed"; NOTE="Market closed by clock - prices are the last close (holiday calendar unavailable)."
            fi
            echo "::warning::Market-status lookup failed; using clock-based status ($STATUS)"
          fi
          if [ "$STATUS" = "open" ]; then PRICE_TYPE="live"; else PRICE_TYPE="close"; fi
          echo "Market status: $STATUS"

          # Fetch one quote; retry once on an error or unreadable response
          fetch() {
            local r=""
            for attempt in 1 2; do
              r=$(curl -s --max-time 15 "https://finnhub.io/api/v1/quote?symbol=$1&token=${FINNHUB_KEY}" || true)
              if echo "$r" | jq -e 'type == "object" and (has("error") | not)' >/dev/null 2>&1; then
                echo "$r"
                return 0
              fi
              sleep 3
            done
            echo "$r"
            return 1
          }

          TICKERS=$(tr -d '\r' < tickers.txt | tr '\n' ' ')
          QUOTES='{}'
          TOTAL=0
          ZERO=0
          LATEST_T=0

          for TICKER in $TICKERS; do
            # Skip empty lines and comments
            [[ -z "$TICKER" || "$TICKER" == \#* ]] && continue
            TOTAL=$((TOTAL + 1))

            # Guard 2: any API error (bad key, rate limit that survives a retry) fails the run
            if ! QUOTE=$(fetch "$TICKER"); then
              echo "::error::Finnhub request failed on $TICKER: $QUOTE"
              exit 1
            fi

            C=$(echo "$QUOTE" | jq -r '.c // 0')
            T=$(echo "$QUOTE" | jq -r '.t // 0')
            if [ "$C" = "0" ]; then
              echo "::warning::$TICKER returned a zero price (bad or delisted symbol?)"
              ZERO=$((ZERO + 1))
            fi
            if [ "$T" -gt 0 ] 2>/dev/null; then
              AS_OF=$(TZ='America/Chicago' date -d "@$T" '+%Y-%m-%d %H:%M %Z')
              [ "$T" -gt "$LATEST_T" ] && LATEST_T=$T
            else
              AS_OF=""
            fi

            QUOTES=$(echo "$QUOTES" | jq -c --arg k "$TICKER" --argjson q "$QUOTE" \
              --arg type "$PRICE_TYPE" --arg asof "$AS_OF" \
              '. + {($k): {price: ($q.c // 0), change: ($q.d // 0), change_pct: ($q.dp // 0),
                           high: ($q.h // 0), low: ($q.l // 0), open: ($q.o // 0),
                           prev_close: ($q.pc // 0), price_type: $type, as_of_ct: $asof}}')

            # Rate limit: Finnhub free tier = 60 calls/min
            sleep 1
          done

          # Guard 3: never replace good prices with an all-zero file
          if [ "$TOTAL" -eq 0 ] || [ "$ZERO" -eq "$TOTAL" ]; then
            echo "::error::All $TOTAL tickers returned zero prices; keeping the last good prices.json"
            exit 1
          fi

          if [ "$LATEST_T" -gt 0 ]; then
            PRICES_AS_OF=$(TZ='America/Chicago' date -d "@$LATEST_T" '+%Y-%m-%d %H:%M %Z')
          else
            PRICES_AS_OF=""
          fi

          OUT=$(mktemp)
          jq -n --arg u "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
                --arg uct "$(TZ='America/Chicago' date '+%Y-%m-%d %H:%M:%S %Z')" \
                --arg st "$STATUS" --arg note "$NOTE" --arg asof "$PRICES_AS_OF" \
                --argjson q "$QUOTES" \
                '{updated: $u, updated_ct: $uct, market_status: $st, market_note: $note,
                  prices_as_of_ct: $asof, quotes: $q}' > "$OUT"

          # Guard 4: output must be valid JSON
          if ! jq -e . "$OUT" >/dev/null; then
            echo "::error::Built invalid JSON; keeping the last good prices.json"
            exit 1
          fi

          # Outside market hours, skip the write when nothing changed (avoids a commit every 5 minutes)
          if [ "$STATUS" != "open" ] && [ -f prices.json ]; then
            OLD=$(jq -S -c '{s: .market_status, q: .quotes}' prices.json 2>/dev/null || echo "none")
            NEW=$(jq -S -c '{s: .market_status, q: .quotes}' "$OUT")
            if [ "$OLD" = "$NEW" ]; then
              echo "Market $STATUS and prices unchanged; no update needed."
              exit 0
            fi
          fi

          mv "$OUT" prices.json
          cat prices.json

      - name: Commit and push
        run: |
          git config user.name "Stock Price Bot"
          git config user.email "bot@stockprices.local"
          git add prices.json
          git diff --cached --quiet || git commit -m "Price update $(TZ='America/Chicago' date '+%H:%M CT')"
          git push
